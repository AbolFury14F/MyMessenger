<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان PV</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 450px;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #075e54, #128c7e);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .target-bar {
            background-color: #e9edef;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ccc;
            font-size: 14px;
        }
        .target-bar input {
            padding: 6px;
            border-radius: 5px;
            border: 1px solid #aaa;
            width: 150px;
        }
        .target-bar button {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
        }
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 14px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }
        .sent {
            background-color: #dcf8c6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .received {
            background-color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .sender-name {
            font-size: 10px;
            color: #666;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 20px;
            outline: none;
        }
        .input-area button {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 20px;
            cursor: pointer;
        }
        .login-popup {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
        }
        .login-popup input {
            width: 80%;
            padding: 12px;
            border: 1px solid #ccc;

border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .login-popup button {
            background-color: #128c7e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <!-- صفحه ورود -->
        <div class="login-popup" id="loginPopup">
            <h2>ورود به پیام‌رسان</h2>
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کنید...">
            <button onclick="login()">ورود</button>
        </div>

        <!-- نوار انتخاب مخاطب -->
        <div class="header" id="headerTitle">چت خصوصی</div>
        <div class="target-bar">
            <span>چت با:</span>
            <input type="text" id="targetUserInput" placeholder="نام مخاطب...">
            <button onclick="setTarget()">تنظیم مخاطب</button>
        </div>

        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
