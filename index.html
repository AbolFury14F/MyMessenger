<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پیام‌رسان من</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 90vh;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #e0e0e0;
            position: relative;
        }
        .header {
            background: linear-gradient(135deg, #075e54, #128c7e);
            color: white;
            padding: 18px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background-color: #efeae2;
            display: flex;
            flex-direction: column;
        }
        .message {
            padding: 10px 15px;
            border-radius: 12px;
            margin-bottom: 10px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.5;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
            position: relative;
        }
        .sent {
            background-color: #dcf8c6;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .received {
            background-color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .sender-name {
            font-size: 11px;
            color: #666;
            margin-bottom: 4px;
            font-weight: bold;
        }
        .input-area {
            display: flex;
            padding: 10px;
            background-color: #f0f0f0;
            border-top: 1px solid #ddd;
        }
        .input-area input {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 24px;
            outline: none;
            font-size: 14px;
        }
        .input-area button {
            background-color: #128c7e;
            color: white;
            border: none;
            padding: 10px 20px;
            margin-right: 10px;
            border-radius: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        /* استایل صفحه ورود (Popup) */
        .login-popup {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 20px;
            transition: opacity 0.3s;
        }
        .login-popup h2 { margin-bottom: 20px; color: #075e54; }
        .login-popup input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 16px;
        }
        .login-popup button {
            background-color: #128c7e;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="chat-container">
        <!-- صفحه ورود -->
        <div class="login-popup" id="loginPopup">
            <h2>خوش آمدید</h2>
            <input type="text" id="usernameInput" placeholder="نام خود را وارد کنید...">
            <button onclick="login()">ورود به چت</button>
        </div>

        <!-- صفحه چت -->
        <div class="header">چت من</div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <input type="text" id="messageInput" placeholder="پیام خود را بنویسید...">
            <button onclick="sendMessage()">ارسال</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
